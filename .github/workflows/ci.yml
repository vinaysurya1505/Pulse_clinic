name: CI Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Environment Config
        run: npx tsx scripts/validate-env.ts --env=development

      - name: TypeScript Check (All Workspaces)
        run: pnpm typecheck

      - name: Automated E2E & Security Tests
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          HMAC_SECRET: test-hmac-secret-key-32chars-long
          OUTBOX_ENCRYPTION_KEY: test-outbox-key-32-chars-long!
          CRON_SECRET: test-cron-secret-key-2026

      - name: Production Build
        run: pnpm build
